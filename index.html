<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetRent - Autopůjčovna</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>FleetRent - Kalkulačka pronájmu</h1>
    <p>Správa vozového parku a dynamický výpočet cen</p>
</header>

<div class="container">
    <div class="controls">
        <div class="form-group">
            <label for="pocetDni"><strong>Počet dní pronájmu:</strong></label>
            <input type="number" id="pocetDni" value="3" min="1">
        </div>
        
        <form id="addVehicleForm" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;">
            <div class="form-group">
                <label for="typVozidla">Typ vozidla:</label>
                <select id="typVozidla">
                    <option value="osobni">Osobní auto</option>
                    <option value="dodavka">Dodávka</option>
                </select>
            </div>
            <div class="form-group">
                <label for="spz">SPZ:</label>
                <input type="text" id="spz" placeholder="Např. 5E5 5555" required>
            </div>
            <div class="form-group">
                <label for="zakladniCena">Zákl. cena/den:</label>
                <input type="number" id="zakladniCena" value="1000" min="1" required>
            </div>
            
            <div class="form-group" id="boxLuxus">
                <label>
                    <input type="checkbox" id="jeLuxusni"> Je luxusní? (+25%)
                </label>
            </div>
            <div class="form-group hidden" id="boxNosnost">
                <label for="nosnost">Nosnost (kg):</label>
                <input type="number" id="nosnost" value="1000" min="1">
            </div>
            <div class="form-group" style="justify-content: flex-end; padding-bottom: 2px;">
                <label>Odhad ceny:</label>
                <div id="cenaNahled" style="font-size: 1.3rem; font-weight: bold; color: #28a745;">0 Kč</div>
            </div>
            <button type="submit">Přidat vozidlo</button>
        </form>
    </div>

    <div id="vehicleGrid" class="vehicle-grid"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
